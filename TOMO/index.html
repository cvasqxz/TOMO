<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOMO - Markdown Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&family=Kode+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { opacity: 0; }
    body.ready { opacity: 1; transition: opacity 0.15s ease; }
  </style>
</head>
<body>
  <!-- Welcome Screen (shown when no file is loaded) -->
  <div id="welcome-screen" class="welcome-container">
    <h1 class="welcome-title gradient-text" id="welcome-title">#TOMO</h1>
    <div class="welcome-divider" id="welcome-divider"></div>
    <div class="welcome-buttons" id="welcome-buttons">
      <button id="open-file" class="welcome-btn">Open File</button>
      <button id="theme-toggle" class="welcome-btn">Toggle Theme</button>
    </div>
  </div>

  <!-- Floating controls (shown when file is loaded) -->
  <div id="floating-controls" class="floating-controls floating-controls-hidden">
    <button id="floating-theme-toggle" class="floating-btn" title="Toggle Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <button id="floating-open-file" class="floating-btn" title="Open File">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <polyline points="13 2 13 9 20 9"/>
      </svg>
    </button>
    <button id="floating-search" class="floating-btn" title="Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
    <button id="floating-close-file" class="floating-btn" title="Close File">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Reader View (shown when file is loaded) -->
  <div id="reader-view" class="reader-hidden">
    <header class="reader-header">
      <div class="reader-header-left">
        <div class="reader-logo gradient-text">TOMO</div>
        <span id="file-name" class="reader-file-name"></span>
      </div>
    </header>

    <div class="reader-container">
      <main id="content-area" class="reader-content">
        <!-- Markdown content will be rendered here -->
      </main>

      <aside id="nav-map" class="reader-nav-map" role="navigation" aria-label="Document sections">
        <div class="nav-map-title">Navigation</div>
        <ul class="nav-map-list" id="nav-map-list">
          <!-- Navigation will be generated dynamically -->
        </ul>
      </aside>
    </div>

  </div>

  <!-- Search (floating, independent of reader view) -->
  <div id="search-container">
    <div class="search-bar-content">
      <input type="text" id="search-input" placeholder="Search..." aria-label="Search">
      <div class="search-controls">
        <span id="search-count">0/0</span>
        <button id="search-prev" class="floating-btn">↑</button>
        <button id="search-next" class="floating-btn">↓</button>
        <button id="search-close" class="floating-btn">✕</button>
      </div>
    </div>
  </div>

  <!-- Vite will process this file and resolve all dependencies -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
