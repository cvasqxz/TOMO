<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be9fd"/>
      <stop offset="50%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
  </defs>
  <!-- # symbol inspired by Kode Mono geometry - monospaced, bold, geometric -->
  <g fill="url(#grad)">
    <!-- Left vertical bar (slightly tilted like Kode Mono #) -->
    <rect x="148" y="56" width="48" height="400" rx="4" transform="rotate(-8 172 256)"/>
    <!-- Right vertical bar -->
    <rect x="316" y="56" width="48" height="400" rx="4" transform="rotate(-8 340 256)"/>
    <!-- Top horizontal bar -->
    <rect x="88" y="168" width="336" height="48" rx="4"/>
    <!-- Bottom horizontal bar -->
    <rect x="88" y="296" width="336" height="48" rx="4"/>
  </g>
</svg>
